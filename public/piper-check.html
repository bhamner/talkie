<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Piper lead-in check</title>
        <script type="importmap">
            {
                "imports": {
                    "onnxruntime-web/wasm": "/vendor/onnxruntime-web/dist/esm/ort.wasm.min.js"
                }
            }
        </script>
    </head>
    <body>
        <pre id="out">starting</pre>
        <script type="module">
            const out = document.getElementById('out');
            const log = (message) => {
                out.textContent += `\n${message}`;
            };

            try {
                Object.defineProperty(navigator, 'hardwareConcurrency', { configurable: true, get: () => 1 });
            } catch {
                // Safari may refuse.
            }

            const measure = (buffer) => {
                const view = new DataView(buffer);
                const dataBytes = view.getUint32(40, true);
                const sampleRate = view.getUint32(24, true);
                let loudest = 0;

                for (let index = 44; index + 1 < 44 + dataBytes && index + 1 < buffer.byteLength; index += 2) {
                    loudest = Math.max(loudest, Math.abs(view.getInt16(index, true)));
                }

                const peak = loudest / 32768;
                const seconds = dataBytes / 2 / sampleRate;

                return { peak, seconds, faint: peak < 0.2 || seconds < 0.28 };
            };

            try {
                const { TtsSession } = await import('/vendor/piper/dist/piper-tts-web.js');
                const session = await TtsSession.create({
                    voiceId: 'en_US-libritts_r-medium',
                    wasmPaths: {
                        onnxWasm: 'https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.18.0/',
                        piperData: 'https://cdn.jsdelivr.net/npm/@diffusionstudio/piper-wasm@1.0.0/build/piper_phonemize.data',
                        piperWasm: 'https://cdn.jsdelivr.net/npm/@diffusionstudio/piper-wasm@1.0.0/build/piper_phonemize.wasm',
                    },
                });

                for (const text of ['in', '---in.', 'by', '---by.', 'buy', '---buy.', 'bye', '---bye.', 'the', '---the.']) {
                    const wav = await session.predict(text);
                    const stats = measure(await wav.arrayBuffer());
                    log(`${JSON.stringify(text)} peak=${stats.peak.toFixed(3)} dur=${stats.seconds.toFixed(2)}s faint=${stats.faint}`);
                }

                log('done');
            } catch (error) {
                log(`error ${error instanceof Error ? error.stack || error.message : String(error)}`);
            }
        </script>
    </body>
</html>
